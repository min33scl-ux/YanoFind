<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YANO FIND — Demo Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--card:#fff;--soft:#f3f4f6;--line:#e2e4e8;--mut:#5b6068;--blue:#2563EB;--green:#22A447;--yellow:#FACC15;--red:#E53935;--gt:#146b2c;--rt:#b3231f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#fff;--card:#1b1b1d;--soft:#232326;--line:#333;--mut:#a5a9b0;--gt:#5ee283;--rt:#ff8a85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#fff;--card:#1b1b1d;--soft:#232326;--line:#333;--mut:#a5a9b0;--gt:#5ee283;--rt:#ff8a85;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:240px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:fixed;top:env(safe-area-inset-top,0px);bottom:0;overflow:auto;z-index:20;transition:transform .2s}
main{margin-left:240px;flex:1;min-width:0;padding:20px}
.top{display:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;z-index:25;align-items:center;gap:10px}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}main{margin-left:0;padding:14px}.top{display:flex}}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin:4px 8px 14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut);display:flex;justify-content:space-between}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--blue);color:#fff}
h1{font-size:24px;margin:0 0 4px;font-weight:800}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--green);color:#111}.btn.r{background:var(--red)}.btn.o{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.t-g{color:var(--gt)}.t-r{color:var(--rt)}.t-b{color:var(--blue)}.t-y{background:var(--yellow);color:#111;border-color:var(--yellow)}.t-m{color:var(--mut)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.photo{height:150px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:48px;margin-bottom:8px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .3s}article.card{transition:transform .15s,box-shadow .15s}article.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14)}article.card:hover .photo img{transform:scale(1.07)}.drop{border:2px dashed var(--blue);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--soft)}.drop.on{background:var(--yellow);color:#111}.hero{background:#111;color:#fff;border:2px solid var(--blue);border-radius:16px;padding:18px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:14px}.xp{height:12px;border-radius:6px;background:#333;overflow:hidden;min-width:220px;margin-bottom:4px}.xp i{display:block;height:100%;background:var(--yellow);animation:grow 1.1s}@keyframes grow{from{width:0}}.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:60;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}.podium .card{animation:pop .5s backwards}.podium .card:nth-child(2){animation-delay:.15s}.podium .card:nth-child(3){animation-delay:.3s}@keyframes pop{from{transform:translateY(26px);opacity:0}}.steps{display:flex;gap:4px;margin:8px 0}.steps span{flex:1;font-size:11px;text-align:center;border-top:4px solid var(--line);padding-top:3px;color:var(--mut)}.steps span.d{border-color:var(--green);color:var(--gt);font-weight:700}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bar{height:10px;border-radius:5px;background:var(--blue)}
.demo{background:var(--yellow);color:#111;font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px;margin-bottom:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:480px;width:calc(100% - 28px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:600}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.podium .card:first-child{border:2px solid var(--yellow)}
</style></head>
<body>
<div class="top"><button class="btn o" id="menu" aria-label="Open menu">☰ Menu</button><b>YANO FIND</b></div>
<div class="app">
<aside id="side">
 <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="#2563EB" stroke-width="3.5"/><path d="M20 20l8 8" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/><path d="M9 13l3 3 5-6" fill="none" stroke="#22A447" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>YANO FIND</div>
 <label for="role" style="margin-top:0">Demo role</label>
 <select id="role"><option value="student">Student</option><option value="mod">Moderator</option><option value="admin">Administrator</option></select>
 <nav class="nav" id="nav" style="margin-top:12px" aria-label="Main"></nav>
</aside>
<main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Identification Cards','Wallets and Purses','Phones and Electronics','Bags and Backpacks','Keys','Clothing and Accessories','Books and School Supplies','Jewelry','Water Bottles and Containers','Umbrellas','Other'];
const ICON={'Identification Cards':'🪪','Wallets and Purses':'👛','Phones and Electronics':'📱','Bags and Backpacks':'🎒','Keys':'🔑','Clothing and Accessories':'🧢','Books and School Supplies':'📚','Jewelry':'💍','Water Bottles and Containers':'🧴','Umbrellas':'☂️','Other':'📦'};
const CLAIM_HELP={pending:'Waiting for a reviewer.',under_review:'A reviewer is checking your answers.',more_info:'The reviewer needs more details.',handover_pending:'Approved. Meet safely to hand over the item, then both sides confirm.',returned:'Return verified by both sides.',rejected:'Claim was not approved.',cancelled:'You cancelled this claim.'};
const S={
 role:'student',view:'dash',me:'u1',authed:false,authTab:'login',rc:'',accts:[],
 users:[{id:'u1',name:'Maria Santos',yr:3,col:'CTET',prog:'BSIT',st:'active'},{id:'u2',name:'Jon Dela Cruz',yr:2,col:'CTET',prog:'BSED MATH',st:'active'},{id:'u3',name:'Ana Reyes',yr:4,col:'CTET',prog:'BEED',st:'active'},{id:'u4',name:'Leo Garcia',yr:1,col:'COE',prog:'BSABE',st:'active'},{id:'u5',name:'Kim Bautista',yr:3,col:'CTET',prog:'BTVTED',st:'suspended'}],
 programs:['BSABE','BSIT','BSED MATH','BSED FIL','BSED ENG','BSNED','BECED','BTVTED','BEED'].map(c=>({c,col:c==='BSABE'?'COE':'CTET'})),
 expTypes:{lost:false,found:false},
 items:[
  {id:1,t:'found',title:'Blue scientific calculator',cat:'Books and School Supplies',loc:'COE Building, Rm 204',date:'2026-10-12',by:'u2',st:'active',mod:'approved',desc:'Found on a desk after Physics lecture.',secret:'Name sticker on the back'},
  {id:2,t:'lost',title:'Black umbrella with wooden handle',cat:'Umbrellas',loc:'Main Gate',date:'2026-10-13',by:'u3',st:'active',mod:'approved',desc:'Left near the guard post.',secret:''},
  {id:3,t:'found',title:'Student ID card',cat:'Identification Cards',loc:'Library',date:'2026-10-14',by:'u1',st:'return_pending',mod:'approved',desc:'ID found beside the printers.',secret:'Student number ends in 482'},
  {id:4,t:'found',title:'Green water bottle',cat:'Water Bottles and Containers',loc:'Gym',date:'2026-10-15',by:'u4',st:'under_review',mod:'pending',desc:'Dented bottle with stickers.',secret:'Three stickers: cat, star, code'},
  {id:5,t:'lost',title:'Samsung phone, cracked corner',cat:'Phones and Electronics',loc:'Canteen',date:'2026-10-15',by:'u1',st:'under_review',mod:'pending',desc:'Lost during lunch break.',secret:''}],
 claims:[{id:1,item:3,by:'u2',details:'My ID, I know the last digits are 482.',st:'handover_pending',fo:false,co:false,reason:'Details match listing.'},{id:2,item:1,by:'u1',details:'It is my calculator.',st:'pending',fo:false,co:false,reason:''}],
 ledger:[{id:1,u:'u1',type:'VALID_POST_REWARD',amt:5,why:'Approved valid post',ts:'2026-10-14'},{id:2,u:'u2',type:'VALID_POST_REWARD',amt:5,why:'Approved valid post',ts:'2026-10-12'},{id:3,u:'u3',type:'VALID_POST_REWARD',amt:5,why:'Approved valid post',ts:'2026-10-13'},{id:4,u:'u3',type:'VERIFIED_RETURN_BONUS',amt:10,why:'Verified return',ts:'2026-10-09'}],
 notifs:[{id:1,t:'Claim received',m:'Jon Dela Cruz claimed your found Student ID.',read:false},{id:2,t:'Post approved',m:'Your Student ID listing is live. +5 EXP.',read:true}],
 audit:[],nid:10,f:{q:'',type:'',cat:''}
};
const U=id=>S.users.find(u=>u.id===id)||{name:'Unknown'};
const exp=id=>S.ledger.filter(l=>l.u===id).reduce((a,l)=>a+l.amt,0);
const rets=id=>S.ledger.filter(l=>l.u===id&&l.type==='VERIFIED_RETURN_BONUS').length;
const NAV={student:[['dash','Dashboard'],['browse','Browse items'],['lost','Report lost item'],['found','Report found item'],['mine','My listings'],['claims','My claims'],['notifs','Notifications'],['board','Leaderboard'],['profile','My profile'],['logout','Log out']],
 mod:[['review','Listings review'],['cr','Claims review'],['board','Leaderboard']],
 admin:[['adm','Admin dashboard'],['users','User management'],['review','All listings'],['cr','Claims management'],['ledger','EXP ledger'],['prog','College and programs'],['ay','Academic year'],['board','Leaderboard'],['audit','Audit log']]};
const STAT={active:['Active','t-g','●'],under_review:['Under review','t-y','◐'],matched:['Matched','t-b','◆'],return_pending:['Return pending','t-b','◔'],returned:['Returned','t-g','✓'],closed:['Closed','t-m','■'],rejected:['Rejected','t-r','✕'],archived:['Archived','t-m','▫']};
const CST={pending:['Pending','t-y'],under_review:['Under review','t-y'],more_info:['More info requested','t-y'],handover_pending:['Handover pending','t-b'],returned:['Returned','t-g'],rejected:['Rejected','t-r'],cancelled:['Cancelled','t-m'],approved:['Approved','t-g']};
const tag=(m,k)=>`<span class="tag ${m[1]}">${m[2]?m[2]+' ':''}${m[0]}</span>`;
const stag=s=>tag(STAT[s]);const ctag=s=>tag(CST[s]);
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function notify(t,m){S.notifs.unshift({id:S.nid++,t,m,read:false})}
function log(a,r){S.audit.unshift({a,r:r||'—',ts:new Date().toISOString().slice(0,16).replace('T',' '),who:S.role})}
function go(v){if(v==='logout'){S.authed=false;S.view='dash';S.authTab='login';return render()}S.view=v;S.pimg=null;$('#side').classList.remove('open');render()}
function nav(){const n=NAV[S.role];$('#nav').innerHTML=n.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?'on':''}" ${S.view===k?'aria-current="page"':''}>${l}${k==='notifs'&&S.notifs.some(x=>!x.read)?' <span class="tag t-y">'+S.notifs.filter(x=>!x.read).length+'</span>':''}</button>`).join('')}
function itemCard(i){return`<article class="card"><div class="photo" style="${tile(i)}">${pic(i)}</div><div class="row" style="justify-content:space-between"><span class="tag ${i.t==='lost'?'t-r':'t-g'}">${i.t==='lost'?'Lost':'Found'}</span>${stag(i.st)}</div><h2 style="margin-top:8px">${esc(i.title)}</h2><div class="sub" style="margin:0 0 8px;font-size:13px">${esc(i.cat)} · ${esc(i.loc)} · ${i.date}</div><button class="btn o" data-open="${i.id}">View details</button></article>`}
const V={
dash(){const me=S.me,pub=S.items.filter(i=>i.mod==='approved');
 return`${hero(me)}<p class="sub">Welcome to YANO FIND. Help reunite lost belongings with their rightful owners and make our campus community more responsible, one find at a time.</p>
 <div class="grid"><div class="card stat"><b>${pub.filter(i=>i.t==='lost'&&i.st==='active').length}</b><span>Active lost reports</span></div><div class="card stat"><b>${pub.filter(i=>i.t==='found'&&i.st==='active').length}</b><span>Active found listings</span></div><div class="card stat"><b>${S.items.filter(i=>i.st==='returned').length}</b><span>Items returned</span></div><div class="card stat"><b>${S.items.filter(i=>i.by===me&&['active','under_review'].includes(i.st)).length}</b><span>My active listings</span></div><div class="card stat"><b>${S.claims.filter(c=>c.by===me&&['pending','under_review','more_info'].includes(c.st)).length}</b><span>My pending claims</span></div><div class="card stat"><b>${exp(me)}</b><span>My total EXP</span></div></div>
 <div class="row" style="margin:16px 0"><button class="btn" data-go="lost">Report a lost item</button><button class="btn g" data-go="found">Report a found item</button><button class="btn o" data-go="browse">Browse found items</button><button class="btn o" data-go="claims">View my claims</button></div>
 <h2>Recently reported</h2>${pub.length?`<div class="cards">${pub.slice(-3).reverse().map(itemCard).join('')}</div>`:'<p class="sub">No listings yet. Report the first one.</p>'}`},
browse(){const f=S.f;let l=S.items.filter(i=>i.mod==='approved'&&(!f.type||i.t===f.type)&&(!f.cat||i.cat===f.cat)&&(!f.q||(i.title+i.desc).toLowerCase().includes(f.q.toLowerCase())));
 return`<h1>Browse items</h1><p class="sub">Search lost and found listings approved by moderators.</p>
 <div class="row" style="margin-bottom:14px"><div style="flex:2;min-width:180px"><label for="fq" class="sr" style="margin:0">Search</label><input id="fq" placeholder="Search title or description" value="${esc(f.q)}"></div><div style="flex:1;min-width:130px"><select id="ft" aria-label="Type"><option value="">Lost and found</option><option value="lost" ${f.type==='lost'?'selected':''}>Lost</option><option value="found" ${f.type==='found'?'selected':''}>Found</option></select></div><div style="flex:1;min-width:150px"><select id="fc" aria-label="Category"><option value="">All categories</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn o" id="fx">Clear filters</button></div>
 ${l.length?`<div class="cards">${l.map(itemCard).join('')}</div>`:'<div class="card"><b>No matches.</b><p class="sub" style="margin:4px 0 0">Try fewer words or clear the filters.</p></div>'}`},
form(t){return`<h1>Report ${t} item</h1><p class="sub">${t==='found'?'Describe it without revealing every identifying detail. Claimants must supply those.':'Tell finders what to look for.'} Moderators review each post before it goes public.</p>
 <form class="card" id="rf" data-t="${t}" style="max-width:560px"><label for="a1">Item title</label><input id="a1" required minlength="3"><label for="a2">Category</label><select id="a2">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label for="a3">Description</label><textarea id="a3" rows="3" required></textarea><label for="a4">Date ${t}</label><input id="a4" type="date" required><label for="a5">Location</label><input id="a5" required><label for="a6">Private identifying details</label><textarea id="a6" rows="2" placeholder="Hidden from public listings"></textarea><label>Photo (optional)</label><input id="a7" type="file" accept="image/jpeg,image/png,image/webp" hidden><div id="pv"></div><label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" id="a8" required style="width:auto">I confirm this information is accurate.</label><div style="margin-top:12px"><button class="btn">Submit report</button></div></form>`},
mine(){const l=S.items.filter(i=>i.by===S.me);return`<h1>My listings</h1><p class="sub">Your posts and where they stand.</p>${l.length?`<div class="cards">${l.map(i=>itemCard(i)+'').join('')}</div>`:'<div class="card">You have no listings yet.</div>'}`},
claims(){const l=S.claims.filter(c=>c.by===S.me||S.items.find(i=>i.id===c.item).by===S.me);
 return`<h1>My claims</h1><p class="sub">Claims you made, and claims on your found items. A return counts only when both sides confirm the handover.</p>${l.length?l.map(c=>{const it=S.items.find(i=>i.id===c.item),fin=it.by===S.me,cl=c.by===S.me;
 return`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${esc(it.title)}</b>${ctag(c.st)}</div><p class="sub" style="margin:4px 0">${CLAIM_HELP[c.st]} ${fin?'(You are the finder.)':'(You are the claimant.)'}</p>${steps(c)}
 ${c.st==='handover_pending'?`<div class="row">Finder: ${c.fo?'<span class="tag t-g">✓ Confirmed</span>':'<span class="tag t-m">Waiting</span>'} Claimant: ${c.co?'<span class="tag t-g">✓ Confirmed</span>':'<span class="tag t-m">Waiting</span>'}</div><div class="row" style="margin-top:8px">${fin&&!c.fo?`<button class="btn g" data-hf="${c.id}">I handed it over</button>`:''}${cl&&!c.co?`<button class="btn g" data-hc="${c.id}">I received it</button>`:''}</div>`:''}
 ${cl&&['pending','more_info'].includes(c.st)?`<button class="btn o" data-cx="${c.id}">Cancel claim</button>`:''}</div>`}).join(''):'<div class="card">No claims yet. Browse found items to make one.</div>'}`},
notifs(){return`<h1>Notifications</h1><div class="row" style="margin:8px 0 14px"><button class="btn o" id="mr">Mark all as read</button></div>${S.notifs.length?S.notifs.map(n=>`<div class="card" style="margin-bottom:8px;${n.read?'':'border-left:4px solid var(--blue)'}"><b>${esc(n.t)}</b> ${n.read?'':'<span class="tag t-b">New</span>'}<div class="sub" style="margin:0">${esc(n.m)}</div></div>`).join(''):'<div class="card">Nothing new.</div>'}`},
board(){const l=S.users.filter(u=>u.st==='active').map(u=>({...u,e:exp(u.id),r:rets(u.id)})).sort((a,b)=>b.e-a.e||b.r-a.r);
 return`<h1>Leaderboard</h1><p class="sub">Ranked by verified EXP, then verified returns. Remaining ties go to administrator review. Demo data only.</p><div class="podium">${l.slice(0,3).map((u,i)=>`<div class="card"><span class="tag t-y">${['1st','2nd','3rd'][i]}</span><h2 style="margin-top:8px">${esc(u.name)}</h2><div class="sub" style="margin:0">${u.prog} · ${u.col}</div><b style="font-size:24px">${u.e} EXP</b></div>`).join('')}</div>
 <div class="card scroll"><table><caption class="sr" style="text-align:left;display:none"></caption><tr><th>Rank</th><th>Student</th><th>Program</th><th>EXP</th><th>Returns</th></tr>${l.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${u.prog}</td><td><b>${u.e}</b></td><td>${u.r}</td></tr>`).join('')}</table></div>`},
profile(){const u=U(S.me);return`<h1>${esc(u.name)}</h1><p class="sub">${u.prog} · ${u.col} · Year ${u.yr}</p>${profForm(u)}<div class="grid" style="margin-top:14px"><div class="card stat"><b>${exp(u.id)}</b><span>Total EXP</span></div><div class="card stat"><b>${S.items.filter(i=>i.by===u.id&&i.mod==='approved').length}</b><span>Valid posts</span></div><div class="card stat"><b>${rets(u.id)}</b><span>Verified returns</span></div></div><h2 style="margin-top:16px">Badges</h2><div class="row">${badges(u.id).map(x=>`<span class='tag t-y'>${x}</span>`).join('')||'<span class="sub">No badges yet.</span>'}</div><h2 style="margin-top:16px">Recent contributions</h2>${S.ledger.filter(l=>l.u===u.id).map(l=>`<div class="card" style="margin-bottom:6px">+${l.amt} EXP · ${l.why} <span class="sub">${l.ts}</span></div>`).join('')||'<div class="card">No contributions yet.</div>'}`},

 if(d.hf||d.hc){const c=S.claims.find(x=>x.id==+(d.hf||d.hc));if(d.hf)c.fo=true;else c.co=true;if(c.fo&&c.co){c.st='returned';const it=S.items.find(i=>i.id===c.item);it.st='returned';const ok=credit(it.by,'VERIFIED_RETURN_BONUS',10,'Verified return','ret'+c.id);notify('Return verified','Both sides confirmed. '+(ok?'+10 EXP to the finder.':''));log('Return verified, claim #'+c.id);toast('Return verified · +10 EXP to the finder');boom()}else toast('Confirmed. Waiting for the other side.');return render()}
 if(d.su){const u=S.users.find(x=>x.id===d.su);return ask((u.st==='active'?'Suspend ':'Restore ')+u.name,r=>{u.st=u.st==='active'?'suspended':'active';log(u.name+' → '+u.st,r);render()})}
 if(t.id==='jx'){const a=+$('#ja').value,r=$('#jr').value.trim();if(!a||!r)return toast('Enter an amount and a reason.');S.ledger.push({id:S.nid++,u:$('#ju').value,type:'ADMIN_ADJUSTMENT',amt:a,why:r,ts:'2026-10-16',key:'adj'+S.nid});log('EXP adjustment '+a,r);toast('Adjustment recorded');return render()}
 if(t.id==='yx'){log('Academic year saved');return toast('Saved')}
 if(t.id==='yf')return ask('Finalize leaderboard (cannot be undone)',r=>{log('Leaderboard finalized',r);toast('Final snapshot saved')});
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='role'){S.role=t.value;S.view=NAV[S.role][0][0];return render()}
 if(t.id==='r3'||t.id==='p3'){const pre=t.id==='r3'?'r':'p',ps=progsFor(t.value),p=$('#'+pre+'4');p.innerHTML=(pre==='r'?'<option value="">Select program</option>':'')+ps.map(x=>`<option>${x.c}</option>`).join('');p.disabled=!ps.length&&pre==='r';const old=$('#pm');if(old)old.remove();if(t.value&&!ps.length){p.insertAdjacentHTML('afterend','<p id="pm" class="sub" style="color:var(--rt);margin:6px 0 0">No programs are assigned to '+t.value+' yet. An administrator must set this up first.</p>')}return}
 if(t.id==='a7'){pickImg(t.files[0]);t.value='';return}
 if(t.id==='ft'){S.f.type=t.value;return render()}if(t.id==='fc'){S.f.cat=t.value;return render()}
 if(d.pm!==undefined){S.programs[+d.pm].col=t.value||null;log(S.programs[+d.pm].c+' → '+(t.value||'unassigned'));toast('Mapping updated');return render()}
 if(d.ex){S.expTypes[d.ex]=t.checked;log('+5 EXP rule: '+d.ex+' '+t.checked)}
});
document.addEventListener('input',e=>{if(e.target.id==='fq'){S.f.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('submit',e=>{const fid=e.target.id;if(fid==='rg'||fid==='lg'||fid==='pf'){e.preventDefault();return formAuth(fid)}if(fid!=='rf')return;e.preventDefault();const g=i=>$('#'+i).value.trim();S.items.push({id:S.nid++,t:e.target.dataset.t,title:g('a1'),cat:g('a2'),desc:g('a3'),date:g('a4'),loc:g('a5'),secret:g('a6'),by:S.me,img:S.pimg||null,st:'under_review',mod:'pending'});S.pimg=null;notify('Listing submitted','Waiting for moderator review.');toast('Submitted. Your photo shows in My listings now and goes public once approved.');go('mine')});
document.addEventListener('click',e=>{if(e.target.closest('.drop'))$('#a7').click()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('drop'))$('#a7').click()});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.drop');if(z){e.preventDefault();z.classList.add('on')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.drop');if(z)z.classList.remove('on')});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('.drop')){e.preventDefault();pickImg(e.dataTransfer.files[0])}});
render();
</script>
</body></html>
